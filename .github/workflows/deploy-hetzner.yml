name: Deploy to Hetzner

# Nur manuell – Push deployt ausschließlich über deploy.yml (GitHub Pages).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hetzner-production
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Prüfen ob Hetzner-Secrets gesetzt sind
        id: hetzner_secrets
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          if [ -z "$HETZNER_SSH_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HETZNER_SSH_KEY fehlt in den Repository-Secrets – Hetzner-Deploy wird übersprungen."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build production bundle for root domain
        if: steps.hetzner_secrets.outputs.configured == 'true'
        run: |
          npm ci
          VITE_APP_BASE=/ npm run build
          tar -czf dist.tar.gz -C dist .

      - name: Upload bundle to server
        if: steps.hetzner_secrets.outputs.configured == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || 22 }}
          source: dist.tar.gz
          target: /tmp

      - name: Extract bundle on server
        if: steps.hetzner_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || 22 }}
          script: |
            root="${{ secrets.HETZNER_WEB_ROOT }}"
            mkdir -p "$root"
            rm -rf "${root:?}/"*
            tar -xzf /tmp/dist.tar.gz -C "$root"
            rm -f /tmp/dist.tar.gz
